<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temple Runner</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    user-select: none;
}

#game {
    display: block;
    width: 100vw;
    height: 100vh;
    background: #222;
}

#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    right: 15px;
    display: flex;
    justify-content: space-between;
    color: white;
    font-size: 22px;
    font-weight: bold;
    text-shadow: 2px 2px 4px black;
    z-index: 5;
}

#gameOver {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(0,0,0,0.75);
    color: white;
    z-index: 10;
}

#gameOver h1 {
    font-size: 48px;
    color: #ffcc33;
    margin-bottom: 15px;
}

#gameOver p {
    font-size: 24px;
    margin-bottom: 20px;
}

#restart {
    border: none;
    padding: 14px 30px;
    border-radius: 10px;
    background: #e39b22;
    color: white;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
}

#controls {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 15px;
    z-index: 6;
}

.control {
    width: 65px;
    height: 65px;
    border: 2px solid white;
    border-radius: 50%;
    background: rgba(0,0,0,0.45);
    color: white;
    font-size: 28px;
    font-weight: bold;
}

.control:active {
    background: rgba(255,180,40,0.8);
}

#help {
    position: fixed;
    bottom: 105px;
    left: 0;
    right: 0;
    text-align: center;
    color: white;
    font-size: 14px;
    text-shadow: 2px 2px 3px black;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
    <div>🏃 Score: <span id="score">0</span></div>
    <div>🪙 Coins: <span id="coins">0</span></div>
</div>

<div id="help">
    ← → Move &nbsp; | &nbsp; ↑ Jump
</div>

<div id="controls">
    <button class="control" id="left">←</button>
    <button class="control" id="jump">↑</button>
    <button class="control" id="right">→</button>
</div>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <p>Coins: <span id="finalCoins">0</span></p>
    <button id="restart">🔄 PLAY AGAIN</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


// -------------------------
// GAME VARIABLES
// -------------------------

let player;
let obstacles;
let coins;
let score;
let coinCount;
let speed;
let gameRunning;

let spawnTimer;
let coinTimer;


// -------------------------
// PLAYER
// -------------------------

function createPlayer() {

    return {
        lane: 1,
        x: 0,
        y: 0,
        width: 45,
        height: 70,

        jumping: false,
        jumpPower: 0,

        color: "#3498db"
    };

}


// -------------------------
// START GAME
// -------------------------

function startGame() {

    player = createPlayer();

    obstacles = [];
    coins = [];

    score = 0;
    coinCount = 0;

    speed = 6;

    spawnTimer = 0;
    coinTimer = 0;

    gameRunning = true;

    document.getElementById("gameOver").style.display = "none";

    requestAnimationFrame(gameLoop);
}


// -------------------------
// LANE POSITION
// -------------------------

function laneX(lane) {

    const roadWidth = W * 0.55;
    const left = (W - roadWidth) / 2;

    return left + roadWidth * (lane + 0.5) / 3;

}


// -------------------------
// DRAW BACKGROUND
// -------------------------

function drawBackground() {

    // Sky
    let gradient = ctx.createLinearGradient(0, 0, 0, H);

    gradient.addColorStop(0, "#68b7d8");
    gradient.addColorStop(0.5, "#c8e6c9");
    gradient.addColorStop(1, "#4d7c3a");

    ctx.fillStyle = gradient;

    ctx.fillRect(0, 0, W, H);


    // Mountains
    ctx.fillStyle = "#486b45";

    ctx.beginPath();

    ctx.moveTo(0, H * 0.42);
    ctx.lineTo(W * 0.2, H * 0.18);
    ctx.lineTo(W * 0.4, H * 0.42);
    ctx.lineTo(W * 0.65, H * 0.15);
    ctx.lineTo(W, H * 0.42);

    ctx.closePath();

    ctx.fill();


    // Trees
    for (let i = 0; i < 12; i++) {

        let x = (i * 137) % W;
        let y = H * 0.32 + (i % 3) * 20;

        ctx.fillStyle = "#573b20";

        ctx.fillRect(x, y, 15, 100);

        ctx.fillStyle = "#176b35";

        ctx.beginPath();

        ctx.arc(x + 7, y - 10, 45, 0, Math.PI * 2);

        ctx.fill();
    }


    // Road
    const roadWidth = W * 0.55;

    const left = (W - roadWidth) / 2;

    ctx.fillStyle = "#594a39";

    ctx.beginPath();

    ctx.moveTo(W * 0.42, H * 0.38);
    ctx.lineTo(W * 0.58, H * 0.38);

    ctx.lineTo(W * 0.92, H);
    ctx.lineTo(W * 0.08, H);

    ctx.closePath();

    ctx.fill();


    // Road edges
    ctx.strokeStyle = "#d7bd75";
    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(W * 0.42, H * 0.38);
    ctx.lineTo(W * 0.08, H);

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(W * 0.58, H * 0.38);
    ctx.lineTo(W * 0.92, H);

    ctx.stroke();


    // Lane lines
    ctx.strokeStyle = "rgba(255,255,255,0.45)";
    ctx.lineWidth = 4;

    for (let i = 1; i < 3; i++) {

        let topX = W * 0.42 + (W * 0.16) * i / 3;

        let bottomX = W * 0.08 + (W * 0.84) * i / 3;

        ctx.beginPath();

        ctx.moveTo(topX, H * 0.38);
        ctx.lineTo(bottomX, H);

        ctx.stroke();
    }

}


// -------------------------
// PLAYER DRAWING
// -------------------------

function drawPlayer() {

    let groundY = H * 0.78;

    let px = laneX(player.lane);

    let py = groundY - player.height - player.y;


    // Shadow
    ctx.fillStyle = "rgba(0,0,0,0.35)";

    ctx.beginPath();

    ctx.ellipse(px, groundY + 5, 30, 10, 0, 0, Math.PI * 2);

    ctx.fill();


    // Body
    ctx.fillStyle = player.color;

    ctx.fillRect(
        px - player.width / 2,
        py + 25,
        player.width,
        45
    );


    // Head
    ctx.fillStyle = "#f1c27d";

    ctx.beginPath();

    ctx.arc(px, py + 12, 16, 0, Math.PI * 2);

    ctx.fill();


    // Hair
    ctx.fillStyle = "#24160e";

    ctx.beginPath();

    ctx.arc(px, py + 7, 16, Math.PI, Math.PI * 2);

    ctx.fill();


    // Legs
    ctx.strokeStyle = "#222";
    ctx.lineWidth = 8;

    ctx.beginPath();

    ctx.moveTo(px - 12, py + 70);
    ctx.lineTo(px - 18, py + 90);

    ctx.moveTo(px + 12, py + 70);
    ctx.lineTo(px + 18, py + 90);

    ctx.stroke();


    // Arms
    ctx.beginPath();

    ctx.moveTo(px - 20, py + 35);
    ctx.lineTo(px - 35, py + 55);

    ctx.moveTo(px + 20, py + 35);
    ctx.lineTo(px + 35, py + 55);

    ctx.stroke();

}


// -------------------------
// OBSTACLE
// -------------------------

function spawnObstacle() {

    obstacles.push({

        lane: Math.floor(Math.random() * 3),

        z: 0,

        width: 55,

        height: 55
    });

}


function drawObstacle(obstacle) {

    let scale = obstacle.z;

    let x = laneX(obstacle.lane);

    let groundY = H * 0.38 + scale * H * 0.4;

    let size = obstacle.width * scale;

    ctx.fillStyle = "#704214";

    ctx.fillRect(
        x - size / 2,
        groundY - size,
        size,
        size
    );


    // Stone details
    ctx.strokeStyle = "#3d250e";
    ctx.lineWidth = 3;

    ctx.strokeRect(
        x - size / 2,
        groundY - size,
        size,
        size
    );


    ctx.fillStyle = "#4d3115";

    ctx.fillRect(
        x - size * 0.3,
        groundY - size * 0.65,
        size * 0.2,
        size * 0.15
    );

}


// -------------------------
// COINS
// -------------------------

function spawnCoin() {

    coins.push({

        lane: Math.floor(Math.random() * 3),

        z: 0,

        collected: false
    });

}


function drawCoin(coin) {

    let scale = coin.z;

    let x = laneX(coin.lane);

    let y = H * 0.35 + scale * H * 0.45;

    let radius = 7 + scale * 18;

    ctx.fillStyle = "#ffd700";

    ctx.beginPath();

    ctx.arc(x, y - radius, radius, 0, Math.PI * 2);

    ctx.fill();


    ctx.strokeStyle = "#b8860b";

    ctx.lineWidth = 3;

    ctx.stroke();


    ctx.fillStyle = "#fff3a3";

    ctx.font = `${Math.max(8, radius)}px Arial`;

    ctx.textAlign = "center";

    ctx.fillText("$", x, y - radius + radius / 3);

}


// -------------------------
// CONTROLS
// -------------------------

function moveLeft() {

    if (!gameRunning) return;

    if (player.lane > 0) {

        player.lane--;

    }

}


function moveRight() {

    if (!gameRunning) return;

    if (player.lane < 2) {

        player.lane++;

    }

}


function jump() {

    if (!gameRunning) return;

    if (!player.jumping) {

        player.jumping = true;

        player.jumpPower = 17;

    }

}


document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") {

        moveLeft();

    }

    if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") {

        moveRight();

    }

    if (e.key === "ArrowUp" || e.key === " ") {

        jump();

    }

});


document.getElementById("left").onclick = moveLeft;

document.getElementById("right").onclick = moveRight;

document.getElementById("jump").onclick = jump;


// -------------------------
// COLLISION
// -------------------------

function checkCollision() {

    for (let obstacle of obstacles) {

        if (obstacle.z > 0.82 && obstacle.z < 1.05) {

            if (obstacle.lane === player.lane) {

                if (player.y < 50) {

                    gameOver();

                    return;

                }

            }

        }

    }


    for (let coin of coins) {

        if (coin.collected) continue;

        if (coin.z > 0.78 && coin.z < 1.08) {

            if (coin.lane === player.lane) {

                if (player.y < 100) {

                    coin.collected = true;

                    coinCount++;

                }

            }

        }

    }

}


// -------------------------
// GAME OVER
// -------------------------

function gameOver() {

    gameRunning = false;

    document.getElementById("finalScore").textContent =
        Math.floor(score);

    document.getElementById("finalCoins").textContent =
        coinCount;

    document.getElementById("gameOver").style.display =
        "flex";

}


document.getElementById("restart").onclick = startGame;


// -------------------------
// GAME LOOP
// -------------------------

function gameLoop() {

    if (!gameRunning) return;


    // Background
    drawBackground();


    // Speed increases
    speed += 0.002;


    // Player jumping
    if (player.jumping) {

        player.y += player.jumpPower;

        player.jumpPower -= 0.8;

        if (player.y <= 0) {

            player.y = 0;

            player.jumping = false;

        }

    }


    // Spawn obstacles
    spawnTimer++;

    if (spawnTimer > Math.max(35, 85 - speed * 3)) {

        spawnObstacle();

        spawnTimer = 0;

    }


    // Spawn coins
    coinTimer++;

    if (coinTimer > 35) {

        spawnCoin();

        coinTimer = 0;

    }


    // Update obstacles
    for (let obstacle of obstacles) {

        obstacle.z += speed / 1000;

    }


    // Update coins
    for (let coin of coins) {

        coin.z += speed / 1000;

    }


    // Remove objects
    obstacles =
        obstacles.filter(o => o.z < 1.2);

    coins =
        coins.filter(c => c.z < 1.2 && !c.collected);


    // Draw obstacles
    for (let obstacle of obstacles) {

        drawObstacle(obstacle);

    }


    // Draw coins
    for (let coin of coins) {

        drawCoin(coin);

    }


    // Player
    drawPlayer();


    // Collision
    checkCollision();


    // Score
    score += 0.1;

    document.getElementById("score").textContent =
        Math.floor(score);

    document.getElementById("coins").textContent =
        coinCount;


    requestAnimationFrame(gameLoop);

}


// Start
startGame();

</script>

</body>
</html>
